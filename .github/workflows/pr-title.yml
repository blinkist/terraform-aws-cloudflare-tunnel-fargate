name: Check PR Title

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event.action != 'edited' || github.event.changes.title.from
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional-commit PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|build|ci|perf|style|revert)(\(.+\))?!?: .+'; then
            echo "::error::PR title must match conventional commits, e.g. 'feat(module): add foo' or 'feat!: breaking change'. Got: $TITLE"
            exit 1
          fi
